<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F7; --card:#FFFFFF; --ink:#10282A; --muted:#55696B; --line:#D9E2E2;
  --brand:#0E4F4C; --brand-ink:#FFFFFF; --gold:#B8892B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1819;--card:#13262710;--ink:#EAF1F1;--muted:#9DB3B3;--line:#243B3C;--brand:#2FA39C;--brand-ink:#06201F;--gold:#D9A93F;}
}
:root[data-theme="dark"]{--bg:#0C1819;--card:#132627;--ink:#EAF1F1;--muted:#9DB3B3;--line:#243B3C;--brand:#2FA39C;--brand-ink:#06201F;--gold:#D9A93F;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:1.75rem;line-height:1.5;margin:0 0 12px;font-weight:700}
.who{color:var(--muted);margin:0 0 28px}
.price{display:flex;align-items:baseline;gap:8px;border-block:1px solid var(--line);padding:18px 0;margin-bottom:24px}
.price b{font-size:3rem;line-height:1;color:var(--brand);font-weight:700}
.price span{font-size:1.1rem;color:var(--muted)}
.price small{margin-inline-start:auto;color:var(--gold);font-weight:500}
h2{font-size:1.05rem;margin:0 0 10px}
ul{list-style:none;padding:0;margin:0 0 28px}
li{padding:8px 0;padding-inline-start:28px;position:relative}
li::before{content:"";position:absolute;inset-inline-start:0;top:16px;width:14px;height:8px;border-inline-start:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
ol{margin:0 0 28px;padding-inline-start:22px}
ol li{padding:4px 0;padding-inline-start:6px}
ol li::before{display:none}
.pay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:700 1.1rem/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.pay:hover{filter:brightness(1.08)}
.pay:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.note{font-size:.88rem;color:var(--muted);text-align:center;margin:14px 0 0}
#msg{display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--gold);border-radius:8px;font-size:.92rem}
.hero{margin:0 0 24px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}.hero img{display:block;width:100%;height:auto;aspect-ratio:900/1150;object-fit:cover;object-position:center top}
.opts{display:grid;gap:12px;margin:0 0 24px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.oi{flex:1;display:flex;flex-direction:column;line-height:1.5}
.oi b{font-size:1.05rem}.oi em{font-style:normal;color:var(--muted);font-size:.9rem}
.op{white-space:nowrap;color:var(--muted)}.op b{font-size:1.8rem;color:var(--brand);line-height:1}
.plan{display:none}.plan.on{display:block}
.paybox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px 16px;text-align:center;margin:0 0 28px}
.amt{margin:0 0 14px;font-size:1.1rem}.amt b{font-size:1.9rem;color:var(--brand)}
.qr{display:block;margin:0 auto 14px;width:220px;max-width:70%;height:auto;background:#fff;padding:0;border-radius:10px}
.paybox p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.num{display:flex;align-items:center;justify-content:center;gap:12px}
.num b{font-size:1.5rem;letter-spacing:.06em;color:var(--ink)}
.num button{font:500 .9rem inherit;font-family:inherit;padding:8px 14px;border-radius:8px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
.num button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.days{margin:0 0 18px;padding:10px 14px;border-inline-start:3px solid var(--gold);background:var(--card);border-radius:8px;font-size:.95rem}
.closed{margin:0 0 24px;padding:16px;border:1.5px solid var(--gold);border-radius:12px;background:var(--card)}
.closed b{display:block;margin-bottom:6px}
.fld{display:block;margin:0 0 14px}
.fld span{display:block;margin-bottom:4px;font-size:.92rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:400 16px/1.6 inherit;font-family:inherit}
.fld textarea{min-height:130px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#B3261E;font-size:.92rem;margin:10px 0 0}
:root[data-theme="dark"] .err{color:#F2B8B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F2B8B5}}
.ok{padding:18px;border:1.5px solid var(--brand);border-radius:12px;background:var(--card);text-align:center}
.ok b{display:block;font-size:1.15rem;margin-bottom:6px;color:var(--brand)}
.step{margin:0 0 28px}
.hp{position:absolute;left:-9999px;opacity:0;height:0}

.topbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:500 .9rem inherit;font-family:inherit;cursor:pointer}
.lang:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 .95rem inherit;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.bank{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font:500 .88rem/1.7 ui-monospace,Menlo,Consolas,monospace;margin:0 0 12px;word-break:break-word;color:var(--ink)}
.pay.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.paybox .pay{margin-top:10px}
.usd{color:var(--muted);font-weight:400;font-size:.85rem;margin-inline-start:6px}
.hint{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.opt .op small{display:block;font-size:.8rem}
li::before{content:"\2713"!important;border:0!important;transform:none!important;width:auto!important;height:auto!important;top:8px!important;color:var(--gold);font-weight:700}
.soc-box{margin:0 0 24px}
.soc{display:flex;flex-wrap:wrap;gap:10px}
.soc a{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;line-height:1.4;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font:500 .88rem inherit;font-family:inherit}
.soc a:hover{border-color:var(--brand)}
.soc a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.soc svg{width:18px;height:18px;fill:currentColor;flex:none}
.adtoggle{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:18px;border:1.5px dashed var(--brand);border-radius:12px;background:var(--card);color:var(--ink);font:500 1rem/1.5 inherit;font-family:inherit;cursor:pointer;margin:0 0 18px}
.adtoggle[aria-expanded="true"]{border-style:solid}
.adtoggle:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.adtoggle .ic{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.adtoggle svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adtoggle small{color:var(--muted);font-weight:400;font-size:.85rem}
.row1{grid-template-columns:1fr}
.warn{border-inline-start:3px solid var(--gold);background:var(--card);padding:8px 12px;border-radius:8px;font-size:.88rem;margin:0 0 12px}
</style>
</head>

    if (!ph) { showErr("e1", t("errPhone")); f.elements.Phone.focus(); return; }
    var file = $("proof").files[0], isPdf = file.type === "application/pdf";
    if (isPdf && file.size > 4 * 1024 * 1024) { showErr("e1", t("errBig")); return; }
    b.disabled = true; b.textContent = t("sending");
    (isPdf ? Promise.resolve(file) : shrink(file)).then(function (blob) {
      if (!blob) throw new Error("img");
      return toB64(blob);
    }).then(function (b64) {
      return api({ action: "proof", plan: cur, name: f.elements.Name.value.trim(), phone: ph,
        email: f.elements.email.value.trim(), company: f.elements.Company.value.trim(), file: b64,
        mime: isPdf ? "application/pdf" : "image/jpeg", lang: lang });
    }).then(function (r) {
      if (!r.ok) throw srvErr(r);
      ref = r.ref;
      document.querySelectorAll('input[name="plan"]').forEach(function (x) { x.disabled = true; });
      $("step1").hidden = true; $("step2").hidden = false;
      $("step2").scrollIntoView({ behavior: "smooth" });
      return loadCfg().catch(function () {});
    }).catch(function (err) {
      fail("e1", b, "sendProof", err.message === "img" ? t("errImg") : t("errSend", { c: err.message }));
    });
  });

  $("f2").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = this, b = $("b2"), pl = PLANS[cur]; $("e2").hidden = true;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    if (pl.when && !$("selDate").value) { fail("e2", b, subKey(), t("errNoDates")); return; }
    b.disabled = true; b.textContent = t("sending");
    var date = $("selDate").value, time = pl.noTime ? "" : $("selTime").value, msg = $("msgText").value.trim();
    if (cur === "ad") {
      msg = [t("adMsgBrand") + ": " + $("adBrand").value.trim(), t("adMsgLoc") + ": " + $("adLoc").value.trim()]
        .concat($("adLink").value.trim() ? [t("adMsgLink") + ": " + $("adLink").value.trim()] : [])
        .concat([t("adMsgDesc") + ":", msg]).join("\n");
    }
    api({ action: "request", ref: ref, message: msg, date: pl.when ? date : "", time: pl.when ? time : "", lang: lang })
      .then(function (r) {
        if (!r.ok) throw srvErr(r);
        var when = pl.when ? "<br>" + (pl.noTime ? t("doneWhenAd", { d: label(date) }) : t("doneWhen", { d: label(date), t: slotTxt(time) })) : "";
        $("done").innerHTML = "<b>" + t("doneTitle") + "</b>" + t("doneRef", { r: ref }) + when + "<br>" + t("doneNote");
        $("step2").hidden = true; $("done").hidden = false;
        $("done").scrollIntoView({ behavior: "smooth" });
      }).catch(function (err) {
        if (err.message === "taken") { fail("e2", b, subKey(), t("errTaken")); loadCfg().catch(function () {}); }
        else fail("e2", b, subKey(), t("errSend", { c: err.message }));
      });
  });
</script>
</body>
</html>
