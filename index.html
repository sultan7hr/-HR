<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F7; --card:#FFFFFF; --ink:#10282A; --muted:#55696B; --line:#D9E2E2;
  --brand:#0E4F4C; --brand-ink:#FFFFFF; --gold:#B8892B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0C1819;--card:#13262710;--ink:#EAF1F1;--muted:#9DB3B3;--line:#243B3C;--brand:#2FA39C;--brand-ink:#06201F;--gold:#D9A93F;}
}
:root[data-theme="dark"]{--bg:#0C1819;--card:#132627;--ink:#EAF1F1;--muted:#9DB3B3;--line:#243B3C;--brand:#2FA39C;--brand-ink:#06201F;--gold:#D9A93F;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:1.75rem;line-height:1.5;margin:0 0 12px;font-weight:700}
.who{color:var(--muted);margin:0 0 28px}
.price{display:flex;align-items:baseline;gap:8px;border-block:1px solid var(--line);padding:18px 0;margin-bottom:24px}
.price b{font-size:3rem;line-height:1;color:var(--brand);font-weight:700}
.price span{font-size:1.1rem;color:var(--muted)}
.price small{margin-inline-start:auto;color:var(--gold);font-weight:500}
h2{font-size:1.05rem;margin:0 0 10px}
ul{list-style:none;padding:0;margin:0 0 28px}
li{padding:8px 0;padding-inline-start:28px;position:relative}
li::before{content:"";position:absolute;inset-inline-start:0;top:16px;width:14px;height:8px;border-inline-start:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
ol{margin:0 0 28px;padding-inline-start:22px}
ol li{padding:4px 0;padding-inline-start:6px}
ol li::before{display:none}
.pay{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:700 1.1rem/1 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.pay:hover{filter:brightness(1.08)}
.pay:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.note{font-size:.88rem;color:var(--muted);text-align:center;margin:14px 0 0}
#msg{display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--gold);border-radius:8px;font-size:.92rem}
.hero{position:relative;margin:0 0 24px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}.hero img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;object-position:center top}
.opts{display:grid;gap:12px;margin:0 0 24px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.oi{flex:1;display:flex;flex-direction:column;line-height:1.5}
.oi b{font-size:1.05rem}.oi em{font-style:normal;color:var(--muted);font-size:.9rem}
.op{white-space:nowrap;color:var(--muted)}.op b{font-size:1.8rem;color:var(--brand);line-height:1}
.plan{display:none}.plan.on{display:block}
.paybox{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:20px 16px;text-align:center;margin:0 0 28px}
.amt{margin:0 0 14px;font-size:1.1rem}.amt b{font-size:1.9rem;color:var(--brand)}
.qr{display:block;margin:0 auto 14px;width:220px;max-width:70%;height:auto;background:#fff;padding:0;border-radius:10px}
.paybox p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.num{display:flex;align-items:center;justify-content:center;gap:12px}
.num b{font-size:1.5rem;letter-spacing:.06em;color:var(--ink)}
.num button{font:500 .9rem inherit;font-family:inherit;padding:8px 14px;border-radius:8px;border:1.5px solid var(--brand);background:transparent;color:var(--brand);cursor:pointer}
.num button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.days{margin:0 0 18px;padding:10px 14px;border-inline-start:3px solid var(--gold);background:var(--card);border-radius:8px;font-size:.95rem}
.closed{margin:0 0 24px;padding:16px;border:1.5px solid var(--gold);border-radius:12px;background:var(--card)}
.closed b{display:block;margin-bottom:6px}
.fld{display:block;margin:0 0 14px}
.fld span{display:block;margin-bottom:4px;font-size:.92rem;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:400 16px/1.6 inherit;font-family:inherit}
.fld textarea{min-height:130px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:3px solid var(--gold);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:#B3261E;font-size:.92rem;margin:10px 0 0}
:root[data-theme="dark"] .err{color:#F2B8B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#F2B8B5}}
.ok{padding:18px;border:1.5px solid var(--brand);border-radius:12px;background:var(--card);text-align:center}
.ok b{display:block;font-size:1.15rem;margin-bottom:6px;color:var(--brand)}
.step{margin:0 0 28px}
.hp{position:absolute;left:-9999px;opacity:0;height:0}

.topbar{display:flex;justify-content:flex-end;margin:0 0 12px}
.lang{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 16px;font:500 .9rem inherit;font-family:inherit;cursor:pointer}
.lang:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{flex:1;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 .95rem inherit;font-family:inherit;cursor:pointer}
.seg button.on{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.bank{white-space:pre-wrap;text-align:start;direction:ltr;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;font:500 .88rem/1.7 ui-monospace,Menlo,Consolas,monospace;margin:0 0 12px;word-break:break-word;color:var(--ink)}
.pay.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.paybox .pay{margin-top:10px}
.usd{color:var(--muted);font-weight:400;font-size:.85rem;margin-inline-start:6px}
.hint{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.opt .op small{display:block;font-size:.8rem}
li::before{content:"\2713"!important;border:0!important;transform:none!important;width:auto!important;height:auto!important;top:8px!important;color:var(--gold);font-weight:700}
.soc-box{margin:0 0 24px}
.soc{display:flex;flex-wrap:wrap;gap:10px}
.soc a{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;line-height:1.4;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font:500 .88rem inherit;font-family:inherit}
.soc a:hover{border-color:var(--brand)}
.soc a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.soc svg{width:18px;height:18px;fill:currentColor;flex:none}
.adtoggle{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:18px;border:1.5px dashed var(--brand);border-radius:12px;background:var(--card);color:var(--ink);font:500 1rem/1.5 inherit;font-family:inherit;cursor:pointer;margin:0 0 18px}
.adtoggle[aria-expanded="true"]{border-style:solid}
.adtoggle:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.adtoggle .ic{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.adtoggle svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adtoggle small{color:var(--muted);font-weight:400;font-size:.85rem}
.row1{grid-template-columns:1fr}
.warn{border-inline-start:3px solid var(--gold);background:var(--card);padding:8px 12px;border-radius:8px;font-size:.88rem;margin:0 0 12px}
.hero.banner{margin:0 0 18px}.hero.banner img{aspect-ratio:3/2;object-position:center}
.grp{font-size:.85rem;color:var(--muted);margin:6px 2px -4px;font-weight:500}
.op .free{font-size:1.4rem;color:var(--brand);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:.92rem}
.chk input{width:20px;height:20px;margin-top:5px;accent-color:var(--brand);flex:none}
.files{font-size:.85rem;color:var(--muted);margin:-6px 0 14px;word-break:break-word}
.opt{text-decoration:none;color:inherit}.op .go{font-size:1.6rem;color:var(--brand)}
.qrsnap{margin:0 0 24px;text-align:center}.qrsnap a{display:inline-block;border-radius:14px;overflow:hidden;border:1px solid var(--line);line-height:0}.qrsnap img{width:min(240px,70vw);height:auto}.qrsnap p{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.hero .snapov{position:absolute;left:9%;bottom:7%;width:42%;border-radius:12px;overflow:hidden;line-height:0;box-shadow:0 4px 18px rgba(0,0,0,.45)}.hero .snapov img{width:100%;height:auto;aspect-ratio:auto;object-fit:contain;display:block}
.sub{font-size:1rem;margin:20px 0 10px}
</style>
</head>

  function label(iso) { return new Date(iso + "T00:00:00Z").toLocaleDateString(lang === "ar" ? "ar" : "en-GB", { timeZone: "UTC", weekday: "long", day: "numeric", month: "long" }); }
  function slotTxt(s) { return lang === "ar" ? s : s.replace(" م", " PM").replace(" ص", " AM"); }
  function usdTxt() { return "≈ $" + Math.round(PLANS[cur].price * USD_PER_OMR).toLocaleString("en"); }

  var firstAvail = null;
  var firstWeek = null;
  function wkLabel(iso) { var e = new Date(Date.parse(iso + "T00:00:00Z") + 6 * 864e5).toISOString().slice(0, 10); return label(iso) + (lang === "ar" ? " إلى " : " to ") + label(e); }
  function buildWeeks() {
    var sw = $("selWeek"), keep = sw.value; sw.innerHTML = ""; firstWeek = null;
    var base = Date.parse((cfg ? cfg.today : new Date().toISOString().slice(0, 10)) + "T00:00:00Z");
    var bk = (cfg && cfg.initBooked && cfg.initBooked[initKind()]) || [], n = 0;
    for (var j = 1; j <= 70 && n < 8; j++) {
      var dt = new Date(base + j * 864e5); if (dt.getUTCDay() !== 0) continue; n++;
      var iso = dt.toISOString().slice(0, 10); if (bk.indexOf(iso) > -1) continue;
      var o = document.createElement("option"); o.value = iso; o.textContent = wkLabel(iso); sw.appendChild(o);
      if (!firstWeek) firstWeek = iso;
    }
    if (keep) sw.value = keep;
    renderDays();
  }
  function renderDays() {
    var d = $("days");
    if (isInit()) { d.textContent = !cfg ? t("wkDefault") : firstWeek ? t("wkNext", { d: wkLabel(firstWeek) }) : t("wkNone"); return; }
    var p = cur === "ad" ? "ad_" : "";
    if (!cfg) { d.textContent = t(p + "daysDefault"); return; }
    d.textContent = firstAvail ? t(p + "daysNext", { d: label(firstAvail) }) : t(p + "daysNone");
  }
  function buildDates() {
    if (isInit()) { buildWeeks(); return; }
    var sd = $("selDate"), st = $("selTime"), kd = sd.value, kt = st.value;
    sd.innerHTML = ""; st.innerHTML = ""; firstAvail = null;
    if (cfg) {
      var t0 = Date.parse(cfg.today + "T00:00:00Z");
      for (var j = 1; j <= cfg.horizon; j++) {
        var dt = new Date(t0 + j * 864e5), iso = dt.toISOString().slice(0, 10);
        var isAd = cur === "ad", od = isAd ? (cfg.adOpenDays || cfg.openDays) : cfg.openDays, bk = isAd ? (cfg.bookedAd || []) : cfg.booked;
        if (od.indexOf(dt.getUTCDay()) > -1 && bk.indexOf(iso) < 0) {
          var o = document.createElement("option"); o.value = iso; o.textContent = label(iso); sd.appendChild(o);
          if (!firstAvail) firstAvail = iso;
        }
      }
      cfg.slots.forEach(function (x) { var o = document.createElement("option"); o.value = x; o.textContent = slotTxt(x); st.appendChild(o); });
      if (kd) sd.value = kd; if (kt) st.value = kt;
    }
    renderDays();
  }
  function loadCfg() {
    if (!SCRIPT_URL) return Promise.reject(new Error("no-url"));
    return fetch(SCRIPT_URL).then(function (r) { return r.json(); }).then(function (c) { cfg = c; buildDates(); });
  }

  function render() {
    var pl = PLANS[cur];
    $("amt").textContent = pl.price; $("amt2").textContent = pl.price; $("usd").textContent = usdTxt();
    $("startNote").hidden = cur !== "corporate"; $("startNote2").hidden = cur !== "corporate";
    document.querySelectorAll(".plan").forEach(function (el) { el.classList.toggle("on", el.dataset.plan === cur); });
    $("coWrap").hidden = cur !== "corporate";
    $("coWrap").querySelector("input").required = cur === "corporate";
    $("when").hidden = !pl.when;
    var ad = cur === "ad";
    $("selDate").required = pl.when; $("selTime").required = pl.when && !pl.noTime;
    $("timeFld").hidden = !!pl.noTime; $("when").classList.toggle("row1", !!pl.noTime);
    $("adFields").hidden = !ad; $("adBrand").required = ad; $("adLoc").required = ad;
    $("adToggle").hidden = !ad; $("adToggle").setAttribute("aria-expanded", ad && adOpen);
    $("f2").hidden = ad && !adOpen;
    $("msgLabel").textContent = t(ad ? "msgLblAd" : cur === "corporate" ? "msgLblCorp" : "msgLbl");
    $("when").querySelector("label span").textContent = t(ad ? "dateLblAd" : "dateLbl");
    $("step2").querySelector("h2").textContent = t(ad ? "step2ad" : pl.when ? "step2when" : "step2");
    if (!$("b2").disabled) $("b2").textContent = t(subKey());
    var msg = t(cur === "corporate" ? "waMsgCorp" : "waMsg", { p: t("pn_" + cur), t: pl.price, u: Math.round(pl.price * USD_PER_OMR) });
    $("inWa").href = "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg);
    var init = isInit();
    $("paySec").hidden = init; $("step1").hidden = init || !!ref; $("step2").hidden = init || !ref;
    $("initStep").hidden = !init || initDone;
    $("selWeek").required = init;
  }
  function renderPay() {
    $("payOm").hidden = payTab !== "om"; $("payIn").hidden = payTab !== "in";
    $("tabOm").className = payTab === "om" ? "on" : ""; $("tabIn").className = payTab === "in" ? "on" : "";
    $("tabOm").setAttribute("aria-pressed", payTab === "om"); $("tabIn").setAttribute("aria-pressed", payTab === "in");
    var link = $("inLink"), bank = $("inBank");
    link.hidden = !INTL_LINK; if (INTL_LINK) link.href = INTL_LINK;
    bank.hidden = !INTL_BANK; bank.textContent = INTL_BANK;
    $("inNone").hidden = !!(INTL_LINK || INTL_BANK);
  }
  function applyLang() {
    var h = document.documentElement; h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    $("planGroup").setAttribute("aria-label", t("planGroup"));
    $("langBtn").textContent = lang === "ar" ? "English" : "العربية";
    buildDates(); render(); renderPay();
    ["b1", "b2"].forEach(function (id) { if (!$(id).disabled) $(id).textContent = t(id === "b1" ? "sendProof" : subKey()); });
  }
  function setLang(l) { lang = l; try { localStorage.setItem("lang", l); } catch (e) {} applyLang(); }

  // ===== تشغيل / init =====
  try { lang = localStorage.getItem("lang") || ""; } catch (e) { lang = ""; }
  if (lang !== "ar" && lang !== "en") lang = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
  try { payTab = Intl.DateTimeFormat().resolvedOptions().timeZone === "Asia/Muscat" ? "om" : "in"; } catch (e) { payTab = "om"; }
  $("payPhone").textContent = PAY_PHONE;
  $("socPay").textContent = PAY_PHONE;
  $("socWa").textContent = WA.replace(/^968/, "");
  $("waLink").href = "https://wa.me/" + WA;
  applyLang();
  loadCfg().catch(function () {});

  $("langBtn").addEventListener("click", function () { setLang(lang === "ar" ? "en" : "ar"); });
  $("tabOm").addEventListener("click", function () { payTab = "om"; renderPay(); });
  $("tabIn").addEventListener("click", function () { payTab = "in"; renderPay(); });
  document.querySelectorAll('input[name="plan"]').forEach(function (r) {
    r.addEventListener("change", function () { cur = r.value; buildDates(); render(); });
  });
  $("adToggle").addEventListener("click", function () {
    adOpen = !adOpen; render();
    if (adOpen) { $("f2").scrollIntoView({ behavior: "smooth", block: "start" }); $("adBrand").focus({ preventScroll: true }); }
  });
  $("copy").addEventListener("click", function () {
    var b = this;
    try { navigator.clipboard.writeText(PAY_PHONE); b.textContent = t("copied"); } catch (e) { b.textContent = PAY_PHONE; }
    setTimeout(function () { b.textContent = t("copy"); }, 2000);
  });

  function shrink(file) {
    return new Promise(function (res) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(u); res(b); }, "image/jpeg", 0.82);
      };
      img.onerror = function () { res(null); };
      img.src = u;
    });
  }
  function toB64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1]); };
      r.onerror = rej; r.readAsDataURL(blob);
    });
  }
  function api(body) {
    if (!SCRIPT_URL) return Promise.reject(new Error("no-url"));
    return fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.text(); }, function () { throw new Error("net"); })
      .then(function (x) { try { return JSON.parse(x); } catch (e) { throw new Error("html"); } });
  }
  // يقبل الرقم العُماني بدون مفتاح الدولة أو معه، وأرقام الدول الأخرى مع رمز الدولة
  function normPhone(v) {
    var d = String(v || "").replace(/[٠-٩]/g, function (c) { return c.charCodeAt(0) - 1632; }).replace(/[^\d+]/g, "");
    d = d.replace(/^\+/, "").replace(/^00/, "");
    if (/^968\d{8}$/.test(d)) return d;
    if (/^\d{8}$/.test(d)) return "968" + d;
    if (/^\d{9,15}$/.test(d)) return d;
    return null;
  }
  function showErr(id, msg) { var e = $(id); e.textContent = msg; e.hidden = false; }
  function fail(id, btn, key, msg) { showErr(id, msg); btn.disabled = false; btn.textContent = t(key); }
  function srvErr(r) { return new Error((r.error || "x") + (r.detail ? ": " + r.detail : "")); }

  $("f1").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = this, b = $("b1"); $("e1").hidden = true;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var ph = normPhone(f.elements.Phone.value);
    if (!ph) { showErr("e1", t("errPhone")); f.elements.Phone.focus(); return; }
    var file = $("proof").files[0], isPdf = file.type === "application/pdf";
    if (isPdf && file.size > 4 * 1024 * 1024) { showErr("e1", t("errBig")); return; }
    b.disabled = true; b.textContent = t("sending");
    (isPdf ? Promise.resolve(file) : shrink(file)).then(function (blob) {
      if (!blob) throw new Error("img");
      return toB64(blob);
    }).then(function (b64) {
      return api({ action: "proof", plan: cur, name: f.elements.Name.value.trim(), phone: ph,
        email: f.elements.email.value.trim(), company: f.elements.Company.value.trim(), file: b64,
        mime: isPdf ? "application/pdf" : "image/jpeg", lang: lang });
    }).then(function (r) {
      if (!r.ok) throw srvErr(r);
      ref = r.ref;
      document.querySelectorAll('input[name="plan"]').forEach(function (x) { x.disabled = true; });
      $("step1").hidden = true; $("step2").hidden = false;
      $("step2").scrollIntoView({ behavior: "smooth" });
      return loadCfg().catch(function () {});
    }).catch(function (err) {
      fail("e1", b, "sendProof", err.message === "img" ? t("errImg") : t("errSend", { c: err.message }));
    });
  });

  $("f2").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = this, b = $("b2"), pl = PLANS[cur]; $("e2").hidden = true;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    if (pl.when && !$("selDate").value) { fail("e2", b, subKey(), t("errNoDates")); return; }
    b.disabled = true; b.textContent = t("sending");
    var date = $("selDate").value, time = pl.noTime ? "" : $("selTime").value, msg = $("msgText").value.trim();
    if (cur === "ad") {
      msg = [t("adMsgBrand") + ": " + $("adBrand").value.trim(), t("adMsgLoc") + ": " + $("adLoc").value.trim()]
        .concat($("adLink").value.trim() ? [t("adMsgLink") + ": " + $("adLink").value.trim()] : [])
        .concat([t("adMsgDesc") + ":", msg]).join("\n");
    }
    api({ action: "request", ref: ref, message: msg, date: pl.when ? date : "", time: pl.when ? time : "", lang: lang })
      .then(function (r) {
        if (!r.ok) throw srvErr(r);
        var when = pl.when ? "<br>" + (pl.noTime ? t("doneWhenAd", { d: label(date) }) : t("doneWhen", { d: label(date), t: slotTxt(time) })) : "";
        $("done").innerHTML = "<b>" + t("doneTitle") + "</b>" + t("doneRef", { r: ref }) + when + "<br>" + t("doneNote");
        $("step2").hidden = true; $("done").hidden = false;
        $("done").scrollIntoView({ behavior: "smooth" });
      }).catch(function (err) {
        if (err.message === "taken") { fail("e2", b, subKey(), t("errTaken")); loadCfg().catch(function () {}); }
        else fail("e2", b, subKey(), t("errSend", { c: err.message }));
      });
  });

  // ===== طلبات المبادرات المجانية / free initiatives =====
  var MAXIMG = 8, MAXVID = 2, VIDMAX = 8 * 1024 * 1024;
  $("i_media").addEventListener("change", function () {
    var n = this.files.length; $("i_files").textContent = n ? t("filesCount", { n: n }) : "";
  });
  $("f3").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = this, b = $("b3"); $("e3").hidden = true;
    if (!f.checkValidity()) { f.reportValidity(); return; }
    var ph = normPhone($("i_phone").value);
    if (!ph) { showErr("e3", t("errPhone")); $("i_phone").focus(); return; }
    if (!$("selWeek").value) { showErr("e3", t("errNoWeeks")); return; }
    var imgs = [], vids = [], bad = false;
    Array.prototype.forEach.call($("i_media").files, function (x) {
      if (x.type.indexOf("image/") === 0) imgs.push(x); else if (x.type.indexOf("video/") === 0) vids.push(x); else bad = true;
    });
    if (bad) { showErr("e3", t("errMedia")); return; }
    if (imgs.length > MAXIMG || vids.length > MAXVID) { showErr("e3", t("errCount")); return; }
    if (vids.some(function (v) { return v.size > VIDMAX; })) { showErr("e3", t("errVid")); return; }
    b.disabled = true; b.textContent = t("sending");
    var kind = initKind(), week = $("selWeek").value;
    Promise.all(imgs.map(function (x) {
      return shrink(x).then(function (bl) {
        if (!bl) throw new Error("img");
        return toB64(bl).then(function (d) { return { name: x.name.replace(/\.[^.]+$/, "") + ".jpg", mime: "image/jpeg", data: d }; });
      });
    })).then(function (ia) {
      return Promise.all(vids.map(function (x) {
        return toB64(x).then(function (d) { return { name: x.name, mime: x.type || "video/mp4", data: d }; });
      })).then(function (va) { return ia.concat(va); });
    }).then(function (media) {
      return api({ action: "initiative", kind: kind, week: week, name: $("i_name").value.trim(), project: $("i_proj").value.trim(),
        phone: ph, email: $("i_email").value.trim(), about: $("i_about").value.trim(),
        instagram: $("i_ig").value.trim(), tiktok: $("i_tt").value.trim(), x: $("i_x").value.trim(), snapchat: $("i_sc").value.trim(),
        other: $("i_other").value.trim(), mediaLink: $("i_mlink").value.trim(), media: media, lang: lang });
    }).then(function (r) {
      if (!r.ok) throw srvErr(r);
      initDone = true;
      document.querySelectorAll('input[name="plan"]').forEach(function (x) { x.disabled = true; });
      $("done").innerHTML = "<b>" + t("doneTitle") + "</b>" + t("doneRef", { r: r.ref }) + "<br>" + t("doneWeek", { d: wkLabel(week) }) + "<br>" + t("doneNoteInit");
      $("initStep").hidden = true; $("done").hidden = false;
      $("done").scrollIntoView({ behavior: "smooth" });
    }).catch(function (err) {
      if (err.message === "taken") { fail("e3", b, "submitInit", t("errWeekTaken")); loadCfg().catch(function () {}); }
      else fail("e3", b, "submitInit", err.message === "img" ? t("errImg") : t("errSend", { c: err.message }));
    });
  });
</script>
</body>
</html>
